<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Import clean fonts */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono&display=swap');
        
        body { font-family: 'Inter', sans-serif; }
        
        /* Force Monaco to fit the ultra-minimalist white theme */
        .monaco-editor .margin { background-color: #ffffff !important; }
        .monaco-editor, .monaco-editor-background { background-color: #ffffff !important; }
        .diffOverview { display: none !important; } /* Hides the scrollbar minimap */
        
        #editor-container { height: calc(100vh - 65px); }
    </style>
</head>
<body class="bg-white text-black h-screen overflow-hidden flex flex-col">

    <!-- Stark, Minimalist Header -->
    <header class="border-b-2 border-black px-8 py-4 flex justify-between items-center">
        <!-- Removed 'uppercase' from the class list below -->
        <h1 class="text-xl font-black tracking-widest">Diff</h1>
        <div class="text-xs font-mono tracking-tight text-gray-400 uppercase">
            Original &nbsp;/&nbsp; Modified
        </div>
    </header>

    <!-- Editor Mount Point -->
    <div id="editor-container" class="w-full"></div>

    <!-- Load Monaco Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.43.0/min/vs' }});
        
        require(['vs/editor/editor.main'], function() {
            
            // Initialize Diff Editor
            var diffEditor = monaco.editor.createDiffEditor(document.getElementById('editor-container'), {
                theme: 'vs', // Base light theme
                originalEditable: true, 
                renderSideBySide: true,
                automaticLayout: true,
                minimap: { enabled: false },
                fontFamily: "'JetBrains Mono', monospace",
                fontSize: 14,
                lineNumbersMinChars: 3,
                scrollBeyondLastLine: false,
                renderLineHighlight: 'none',
                hideCursorInOverviewRuler: true
            });

            // Create Plain Text Models
            var originalModel = monaco.editor.createModel(
                "Paste original text here...",
                "plaintext"
            );
            var modifiedModel = monaco.editor.createModel(
                "Paste modified text here...",
                "plaintext"
            );

            // Attach to Editor
            diffEditor.setModel({
                original: originalModel,
                modified: modifiedModel
            });
        });
    </script>
</body>
</html>
